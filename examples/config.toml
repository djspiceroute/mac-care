# mac-care configuration
# Copy to ~/.config/mac-care/config.toml and edit to suit your machine.
# All settings are optional — defaults work out of the box.

[policy]
# Where timestamped Markdown + JSON + HTML reports are written.
# Default: ~/.mac-care/reports  (hidden, won't clutter ~/Documents or iCloud Drive)
# Change to any path you prefer, e.g. "~/Documents/mac-care/reports"
reports_dir = "~/.mac-care/reports"

# Where files are moved when mac-care clean --execute is run (never rm).
# Default: ~/.mac-care/quarantine
quarantine_dir = "~/.mac-care/quarantine"

# Old installers (.dmg / .pkg / .zip) in ~/Downloads older than this are surfaced as review findings.
min_age_days = 14

# Paths that are never auto-cleaned, regardless of risk level.
# When set, this replaces the default list entirely — include any defaults you want to keep.
# Any directory containing an active or dirty git repo is also protected at runtime.
protected_paths = [
  "~/.codex",
  "~/.ssh",
  "~/.vscode/extensions",
  "~/Library/Application Support/Google/Chrome/NativeMessagingHosts",
  "~/Library/Application Support/Mozilla/NativeMessagingHosts",
  # "~/Projects/active-client",   # example: protect a specific project directory
]

# Extra directories to scan for workspace/agent content (same logic as ~/Documents/Codex).
# Add paths specific to your machine here rather than hardcoding them in code.
# additional_scan_paths = [
#   "~/Documents/MyAgents",
#   "~/Documents/AgentWorkspaces",
# ]

# ── Per-category policy overrides ──────────────────────────────────────────
# Override min_age_days for specific finding categories.
# Valid category keys: old_installers, stale_runtimes, xcode_archives, android_gradle_cache
# (and any other category name returned by mac-care scan)
#
# [policy.old_installers]
# min_age_days = 7    # be more aggressive with Downloads installers
#
# [policy.stale_runtimes]
# min_age_days = 180  # flag runtime versions unused for 6+ months (default)
#
# [policy.xcode_archives]
# min_age_days = 60   # keep Xcode archives longer
