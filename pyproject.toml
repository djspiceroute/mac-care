[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-care"
version = "0.1.0"
description = "Local macOS maintenance CLI for safe cleanup reports and developer environment checks."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Deepankar Joshi" }]
dependencies = []

[project.scripts]
mac-care = "mac_care.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
